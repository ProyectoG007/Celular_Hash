# Cerebro en Docker. El celular (ADB), el micrófono y la voz quedan en Windows.
# Local:     docker compose up -d
# Servidor:  docker compose --profile servidor up -d   (con DOMINIO y CLAVES en .env)
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_modelos:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

  # Baja los modelos una sola vez (quedan guardados en el volumen).
  ollama-modelos:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "sleep 5 && ollama pull ${MODELO_CHAT:-qwen2.5:3b} && ollama pull ${MODELO_EMBED:-nomic-embed-text}"]
    restart: "no"

  cerebro:
    build: ./cerebro
    depends_on: [ollama]
    environment:
      OLLAMA_URL: http://ollama:11434
      MODELO_CHAT: ${MODELO_CHAT:-qwen2.5:3b}
      MODELO_EMBED: ${MODELO_EMBED:-nomic-embed-text}
      CLAVES: ${CLAVES:-}
    volumes:
      - datos_rag:/datos
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # Solo en el servidor: HTTPS automático (Let's Encrypt) delante del cerebro.
  caddy:
    image: caddy:2
    profiles: ["servidor"]
    depends_on: [cerebro]
    command: caddy reverse-proxy --from ${DOMINIO:-localhost} --to cerebro:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_datos:/data
    restart: unless-stopped

volumes:
  ollama_modelos:
  datos_rag:
  caddy_datos:
